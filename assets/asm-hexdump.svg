<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 647 244" width="647" height="244" role="img" aria-label="asm-hexdump (Ubuntu 24.04 amd64)">
  <title>asm-hexdump (Ubuntu 24.04 amd64)</title>
  <rect width="647" height="244" rx="8" fill="#0d1117"/>
  <rect width="647" height="28" rx="8" fill="#161b22"/>
  <rect y="20" width="647" height="8" fill="#161b22"/>
  <circle cx="16" cy="14" r="5" fill="#ff5f56"/><circle cx="32" cy="14" r="5" fill="#ffbd2e"/><circle cx="48" cy="14" r="5" fill="#27c93f"/>
  <text x="323.5" y="18" text-anchor="middle" fill="#8b949e" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12">asm-hexdump (Ubuntu 24.04 amd64)</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#c9d1d9">
  <text x="18" y="54" xml:space="preserve"><tspan fill="#7ee787">$</tspan> <tspan fill="#ffffff">printf 'Hello, x86-64!\n\x00\x7f\x80\xff' | ./build/asm-hexdump</tspan></text>
  <text x="18" y="73" xml:space="preserve">00000000  48 65 6c 6c 6f 2c 20 78  38 36 2d 36 34 21 0a 00  |Hello, x86-64!..|</text>
  <text x="18" y="92" xml:space="preserve">00000010  7f 80 ff                                          |...|</text>
  <text x="18" y="111" xml:space="preserve">00000013</text>
  <text x="18" y="130" xml:space="preserve"><tspan fill="#7ee787">$</tspan> <tspan fill="#ffffff">./build/asm-hexdump missing.bin; echo "exit=$?"</tspan></text>
  <text x="18" y="149" xml:space="preserve"><tspan fill="#ff7b72">asm-hexdump: missing.bin: No such file or directory</tspan></text>
  <text x="18" y="168" xml:space="preserve"><tspan fill="#8b949e">exit=1</tspan></text>
  <text x="18" y="187" xml:space="preserve"><tspan fill="#7ee787">$</tspan> <tspan fill="#ffffff">./build/asm-hexdump &gt; /dev/full &lt; README.md; echo "exit=$?"</tspan></text>
  <text x="18" y="206" xml:space="preserve"><tspan fill="#ff7b72">asm-hexdump: write error: No space left on device</tspan></text>
  <text x="18" y="225" xml:space="preserve"><tspan fill="#8b949e">exit=1</tspan></text>
  </g>
</svg>
