<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 678 225" width="678" height="225" role="img" aria-label="make security-demo (GitHub Actions, ubuntu-24.04, native x86-64)">
  <title>make security-demo (GitHub Actions, ubuntu-24.04, native x86-64)</title>
  <rect width="678" height="225" rx="8" fill="#0d1117"/>
  <rect width="678" height="28" rx="8" fill="#161b22"/>
  <rect y="20" width="678" height="8" fill="#161b22"/>
  <circle cx="16" cy="14" r="5" fill="#ff5f56"/><circle cx="32" cy="14" r="5" fill="#ffbd2e"/><circle cx="48" cy="14" r="5" fill="#27c93f"/>
  <text x="339.0" y="18" text-anchor="middle" fill="#8b949e" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" font-size="12">make security-demo (GitHub Actions, ubuntu-24.04, native x86-64)</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#c9d1d9">
  <text x="18" y="54" xml:space="preserve"><tspan fill="#7ee787">$</tspan> <tspan fill="#ffffff">make security-demo</tspan></text>
  <text x="18" y="73" xml:space="preserve"><tspan fill="#79c0ff">1. Executable stack: same code, with and without .note.GNU-stack</tspan></text>
  <text x="18" y="92" xml:space="preserve">   binary           PT_GNU_STACK         [stack] at runtime</text>
  <text x="18" y="111" xml:space="preserve">   execstack-bad    <tspan fill="#ff7b72">RWE</tspan>                  <tspan fill="#ff7b72">rwxp</tspan></text>
  <text x="18" y="130" xml:space="preserve">   execstack-good   <tspan fill="#7ee787">RW</tspan>                   <tspan fill="#7ee787">rw-p</tspan></text>
  <text x="18" y="149" xml:space="preserve"></text>
  <text x="18" y="168" xml:space="preserve"><tspan fill="#79c0ff">2. PIE and ASLR: address of _start over three runs</tspan></text>
  <text x="18" y="187" xml:space="preserve">   whereami-nopie   EXEC  0x0000000000401000 0x0000000000401000 0x0000000000401000</text>
  <text x="18" y="206" xml:space="preserve">   whereami-pie     DYN   0x00007f453ab07000 0x00007fc1293b0000 0x00007f7c50f9a000</text>
  </g>
</svg>
